apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  namespace: group-sync-operator
  name: xxcacerts-secret
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: osrosa-xxcacerts  ##The secret name in ocp that is stored in AWS Secret Manager
        metadataPolicy: None
        property: ca.crt  ##KEY1
      secretKey: ca.crt   ##KEY1
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: xxcacerts-store
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: osrosa-xxcacerts   ##The secret name in ocp that is stored in AWS Secret Manager
---
